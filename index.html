<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi Equipe — Team Zohra</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
:root{--bg:#F7F9FC;--bg2:#fff;--bg3:#F8FAFC;--bd:#E2E8F0;--tx:#0F172A;--tx2:#64748B;--tx3:#94A3B8;--bl:#3B82F6;--bl2:#1D4ED8;--bll:#DBEAFE;--gn:#22C55E;--rd:#EF4444;--am:#F59E0B;--pu:#8B5CF6;--dk:#0F172A;--dk2:#1E293B;--dk3:#334155}
body{background:var(--bg);color:var(--tx);min-height:100vh}
#ls{display:flex;flex-direction:column;min-height:100vh;background:linear-gradient(135deg,#EFF6FF,#F0F9FF,#EDE9FE)}
.ltb{background:#fff;border-bottom:1px solid var(--bd);padding:.6rem 1.5rem;display:flex;align-items:center;justify-content:space-between}
.lla{display:flex;align-items:center;gap:10px}
.lli{width:34px;height:34px;background:var(--bl);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px}
.llt{font-size:14px;font-weight:700;color:var(--tx)}
.lls{font-size:11px;color:var(--tx3)}
.lcz{text-align:right}
.lct{font-size:20px;font-weight:700;color:var(--bl2);font-family:monospace;letter-spacing:.05em}
.lcd{font-size:11px;color:var(--tx2)}
.lb{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem}
.lc{background:#fff;border:1px solid var(--bd);border-radius:20px;padding:2.2rem;width:100%;max-width:380px;box-shadow:0 4px 24px rgba(37,99,235,.08)}
.lch{display:flex;align-items:center;gap:12px;margin-bottom:1.75rem;padding-bottom:1.25rem;border-bottom:1px solid var(--bd)}
.lci{width:44px;height:44px;background:linear-gradient(135deg,var(--bl),var(--pu));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
.lct2{font-size:16px;font-weight:700}
.lcd2{font-size:11px;color:var(--tx3);margin-top:2px}
.fl{margin-bottom:1rem}
.fl label{display:block;font-size:10px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.4rem}
.fl select,.fl input{width:100%;background:var(--bg3);border:1.5px solid var(--bd);border-radius:10px;padding:.6rem .9rem;color:var(--tx);font-size:13px;outline:none}
.fl select:focus,.fl input:focus{border-color:var(--bl)}
.btnl{width:100%;background:linear-gradient(135deg,var(--bl),var(--pu));color:#fff;border:none;border-radius:10px;padding:.75rem;font-size:14px;font-weight:700;cursor:pointer;margin-top:.5rem}
.lerr{background:#FEE2E2;border:1px solid #FECACA;border-radius:8px;padding:.55rem .9rem;font-size:12px;color:var(--rd);margin-top:.75rem;display:none}
.lft{text-align:center;padding:.75rem;font-size:11px;color:#CBD5E1}
#app{display:none;flex-direction:column;min-height:100vh}
.tb{background:var(--dk);padding:.6rem 1.2rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.tbl{display:flex;align-items:center;gap:10px;position:relative}
.tblo{width:28px;height:28px;background:var(--bl);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px}
.tblt{color:#fff;font-size:13px;font-weight:700}
.tbbg{background:#1E3A5F;color:#60A5FA;font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid #2563EB33;cursor:pointer}
.tbr{display:flex;align-items:center;gap:8px}
.tbck{color:#60A5FA;font-size:12px;font-family:monospace}
.tbsep{width:1px;height:14px;background:var(--dk3)}
.uav{width:24px;height:24px;border-radius:50%;background:var(--bl);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}
.unm{color:#94A3B8;font-size:12px}
.btnlo{background:none;border:1px solid var(--dk3);border-radius:6px;padding:3px 10px;color:#64748B;font-size:11px;cursor:pointer;font-family:inherit}
.btnlo:hover{border-color:var(--rd);color:var(--rd)}
.cb{background:var(--dk2);padding:.32rem 1.2rem;display:flex;align-items:center;justify-content:space-between}
.cbt{color:#60A5FA;font-size:14px;font-weight:700;font-family:monospace}
.cbst{font-size:10px;color:var(--gn);display:flex;align-items:center;gap:4px}
.cbst::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--gn);display:block}
#mp{display:none;position:absolute;top:48px;left:0;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:1rem;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.12);min-width:250px}
#mp select{background:var(--bg3);border:1px solid var(--bd);border-radius:8px;padding:.4rem .6rem;color:var(--tx);font-size:13px;outline:none;margin-right:.4rem}
#mp button{width:100%;background:linear-gradient(135deg,var(--bl),var(--pu));color:#fff;border:none;border-radius:8px;padding:.5rem;font-size:13px;font-weight:700;cursor:pointer;margin-top:.75rem}
.rb{display:none;padding:.6rem 1.2rem;font-size:12px;font-weight:600;align-items:center;gap:10px}
.rb.daily{background:#FEF3C7;color:#92400E;border-bottom:2px solid #FDE68A}
.rb.weekly{background:#DBEAFE;color:#1E40AF;border-bottom:2px solid #93C5FD}
.rb.on{display:flex}
.rb button{margin-left:auto;background:none;border:none;color:inherit;font-size:16px;font-weight:700;cursor:pointer;opacity:.6}
.al{display:flex;flex:1}
.sb{width:200px;background:#fff;border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0}
.sbs{padding:.6rem .75rem;font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin-top:.5rem}
.si{display:flex;align-items:center;gap:8px;padding:.48rem .75rem;margin:1px .4rem;border-radius:8px;font-size:12px;font-weight:600;color:var(--tx2);cursor:pointer;transition:all .15s}
.si.active{background:var(--bll);color:var(--bl2)}
.si:hover{background:var(--bg3)}
.sii{font-size:15px;width:20px;text-align:center}
.sd{width:6px;height:6px;border-radius:50%;background:var(--rd);margin-left:auto;display:none}
.sd.on{display:block}
.mn{flex:1;padding:1.25rem;overflow:auto}
.pt{font-size:18px;font-weight:700;color:var(--tx);margin-bottom:3px}
.ps{font-size:12px;color:var(--tx2);margin-bottom:1.25rem}
.sr{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.75rem;margin-bottom:1.25rem}
.sc{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:.85rem 1rem;border-left:3px solid var(--bd)}
.sc.bl{border-left-color:var(--bl)}.sc.gn{border-left-color:var(--gn)}.sc.am{border-left-color:var(--am)}.sc.pu{border-left-color:var(--pu)}
.sl{font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.3rem}
.sv{font-size:22px;font-weight:700}
.sv.bl{color:var(--bl)}.sv.gn{color:var(--gn)}.sv.am{color:var(--am)}.sv.pu{color:var(--pu)}
.vt{display:flex;gap:.4rem;margin-bottom:1.25rem;flex-wrap:wrap}
.vtb{padding:.38rem .9rem;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--bd);color:var(--tx2);background:none;font-family:inherit}
.vtb.active{background:var(--bl);border-color:var(--bl);color:#fff}
.mt{display:flex;gap:.4rem;margin-bottom:1.1rem;flex-wrap:wrap}
.mtb{padding:.32rem .8rem;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--bd);color:var(--tx2);background:none;font-family:inherit}
.mtb.active{background:var(--bl);border-color:var(--bl);color:#fff}
.tw{background:#fff;border:1px solid var(--bd);border-radius:12px;overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;min-width:600px}
table.dt th{padding:.55rem .8rem;font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap;background:var(--bg3)}
table.dt th:first-child{text-align:left}
table.dt td{padding:.42rem .8rem;font-size:12px;text-align:center;border-bottom:1px solid var(--bd)}
table.dt td:first-child{text-align:left;font-size:11px;color:var(--tx2);font-family:monospace}
table.dt td:nth-child(2){font-weight:600}
table.dt tr.we td{background:#FAFBFF}
table.dt tr.tod td{background:#F0FFF4}
table.dt tr:last-child td{border-bottom:none}
.ci{background:var(--bg3);border:1.5px solid var(--bd);border-radius:6px;width:64px;padding:.22rem .4rem;color:var(--tx);font-size:12px;font-weight:600;text-align:center;outline:none}
.ci:focus{border-color:var(--bl)}
.ci:disabled{opacity:.3;cursor:default;background:transparent;border-color:transparent}
.ci.gr{color:var(--gn)}.ci.am{color:var(--am)}.ci.bl{color:var(--bl)}.ci.li{color:var(--pu)}
.ti{background:transparent;border:none;width:100%;min-width:90px;color:var(--tx2);font-size:12px;outline:none;font-family:inherit}
.ti:disabled{opacity:.3}
.stot{font-size:13px;font-weight:700;color:var(--gn)}
.rw{background:#fff;border:1px solid var(--bd);border-radius:12px;overflow-x:auto}
.rw table{width:100%;border-collapse:collapse;min-width:700px}
.rw th{padding:.55rem 1rem;font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap;background:var(--bg3)}
.rw th:first-child{text-align:left}
.rw td{padding:.5rem 1rem;font-size:13px;text-align:center;border-bottom:1px solid var(--bd)}
.rw td:first-child{text-align:left;font-weight:600}
.rw tr.tot td{background:var(--bll);font-weight:700;color:var(--bl2);border-top:1px solid var(--bd)}
.rw tr:hover td{background:var(--bg3)}
.nm{font-weight:600}.nm.big{font-size:15px;font-weight:700;color:var(--bl)}
.et{background:#fff;border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.et table{width:100%;border-collapse:collapse}
.et th{padding:.55rem 1rem;font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;text-align:center;border-bottom:1px solid var(--bd);background:var(--bg3)}
.et th:first-child{text-align:left}
.et td{padding:.55rem 1rem;font-size:13px;text-align:center;border-bottom:1px solid var(--bd)}
.et td:first-child{text-align:left;font-weight:600}
.et tr:last-child td{border-bottom:none}
.et tr:hover td{background:var(--bg3)}
.bw{background:var(--bg3);border-radius:20px;height:8px;overflow:hidden;margin:0 auto;width:160px}
.bf{height:100%;border-radius:20px}
.bf.hi{background:linear-gradient(90deg,#16A34A,#4ADE80)}
.bf.mi{background:linear-gradient(90deg,#D97706,#FCD34D)}
.bf.lo{background:linear-gradient(90deg,#DC2626,#F87171)}
.rk{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:12px;font-weight:700}
.rk1{background:#FEF08A;color:#92400E}.rk2{background:#E2E8F0;color:#374151}.rk3{background:#FED7AA;color:#92400E}.rkn{background:var(--bg3);color:var(--tx2)}
.pb{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.phi{background:#DCFCE7;color:#15803D}.pmi{background:#FEF3C7;color:#B45309}.plo{background:#FEE2E2;color:#DC2626}
.ec{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.75rem;margin-top:1.25rem}
.ecd{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:.9rem}
.ecn{font-size:12px;font-weight:700;margin-bottom:.5rem}
.ecb{background:var(--bg3);border-radius:20px;height:6px;overflow:hidden;margin-bottom:.4rem}
.ecf{height:100%;border-radius:20px}
.ecs{display:flex;justify-content:space-between;font-size:11px;color:var(--tx2)}
.ecsc{font-size:18px;font-weight:700;margin-top:.3rem}
.gadd{background:linear-gradient(135deg,var(--bl),var(--pu));color:#fff;border:none;border-radius:8px;padding:.4rem 1rem;font-size:12px;font-weight:600;cursor:pointer;margin-top:.6rem;font-family:inherit}
.gdel{background:none;border:none;color:var(--rd);cursor:pointer;font-size:16px;padding:0 4px}
.cw{background:#fff;border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.ch{background:var(--bg3);padding:.65rem 1rem;border-bottom:1px solid var(--bd);font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.cdot{width:7px;height:7px;border-radius:50%;background:var(--gn)}
.cms{padding:1rem;min-height:220px;max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:.55rem}
.msg{max-width:72%;padding:.55rem .8rem;border-radius:12px;font-size:13px;line-height:1.5}
.msg.sent{background:linear-gradient(135deg,var(--bl),var(--pu));color:#fff;align-self:flex-end;border-bottom-right-radius:3px}
.msg.recv{background:var(--bg3);color:var(--tx);align-self:flex-start;border-bottom-left-radius:3px;border:1px solid var(--bd)}
.mmt{font-size:10px;opacity:.65;margin-top:2px}
.cir{display:flex;gap:.5rem;padding:.65rem 1rem;border-top:1px solid var(--bd);background:var(--bg3)}
.cin{flex:1;background:#fff;border:1px solid var(--bd);border-radius:20px;padding:.45rem .9rem;font-size:13px;outline:none;font-family:inherit;color:var(--tx)}
.cin:focus{border-color:var(--bl)}
.csb{background:linear-gradient(135deg,var(--bl),var(--pu));color:#fff;border:none;border-radius:20px;padding:.45rem 1rem;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.nm2{color:var(--tx3);font-size:13px;text-align:center;padding:2rem}
.msb{background:#fff;border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.msbi{padding:.6rem 1rem;cursor:pointer;font-size:12px;font-weight:600;color:var(--tx2);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.msbi:last-child{border-bottom:none}
.msbi:hover{background:var(--bg3)}
.msbi.active{background:var(--bll);color:var(--bl2)}
.sv2{font-size:12px;color:var(--gn);opacity:0;transition:opacity .3s}
.sv2.show{opacity:1}
.dz{margin-top:1rem}
.dc{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:1.25rem;margin-bottom:1rem}
.bg2{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:.3rem}
.bu{border-radius:8px;padding:.35rem;text-align:center;background:var(--bg3);border:1px solid var(--bd)}
.bu .bd2{font-size:9px;color:var(--tx3)}
.bu .bv{font-size:13px;font-weight:700;color:var(--tx3)}
.bu .bv.has{color:var(--bl)}
.bu.we{border-color:var(--bll)}
.rob{background:#FEF3C7;border:1px solid #FDE68A;border-radius:8px;padding:.5rem 1rem;font-size:12px;font-weight:600;color:#92400E;margin-bottom:.75rem;display:flex;align-items:center;gap:6px}
.ann-card{background:linear-gradient(135deg,var(--bll),#EDE9FE);border:1.5px solid var(--bl);border-radius:14px;padding:1rem 1.25rem;margin-bottom:1rem;position:relative}
.ann-title{font-size:13px;font-weight:700;color:var(--bl2);margin-bottom:.3rem}
.ann-text{font-size:13px;color:var(--tx);line-height:1.5}
.ann-time{font-size:10px;color:var(--tx3);margin-top:.4rem}
.ann-close{position:absolute;top:.75rem;right:.75rem;background:none;border:none;color:var(--tx3);cursor:pointer;font-size:16px}
.ann-compose{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:1rem;margin-bottom:1rem}
.ann-ta{width:100%;background:var(--bg3);border:1.5px solid var(--bd);border-radius:8px;padding:.65rem .9rem;font-size:13px;color:var(--tx);outline:none;font-family:inherit;resize:vertical;min-height:80px}
.ann-ta:focus{border-color:var(--bl)}
.btn-ann{background:linear-gradient(135deg,var(--bl),var(--pu));color:#fff;border:none;border-radius:8px;padding:.5rem 1.1rem;font-size:13px;font-weight:700;cursor:pointer;margin-top:.5rem;font-family:inherit}
.obj-bar-bg{background:var(--bg3);border-radius:20px;height:10px;overflow:hidden;margin:.4rem 0}
.obj-bar-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--bl),var(--pu));transition:width .6s}
.obj-card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:.9rem 1rem;display:flex;flex-direction:column;gap:.3rem}
.obj-name{font-size:12px;font-weight:700}
.obj-nums{display:flex;justify-content:space-between;font-size:11px;color:var(--tx2)}
.obj-pct{font-size:16px;font-weight:700;color:var(--bl)}
.obj-inp{background:var(--bg3);border:1.5px solid var(--bd);border-radius:8px;padding:.3rem .6rem;color:var(--tx);font-size:13px;font-weight:600;width:80px;outline:none;text-align:center;font-family:inherit}
.obj-inp:focus{border-color:var(--bl)}
.btn-exp{background:#fff;border:1.5px solid var(--bd);border-radius:8px;padding:.4rem .9rem;font-size:12px;font-weight:600;color:var(--tx2);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px}
.btn-exp:hover{border-color:var(--bl);color:var(--bl)}
.wbanner{background:linear-gradient(135deg,#FEF08A,#FDE68A);border:1.5px solid var(--am);border-radius:12px;padding:.75rem 1rem;margin-bottom:1rem;display:flex;align-items:center;gap:10px}
.chart-card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:1rem;margin-bottom:1.25rem}
.chart-ttl{font-size:12px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.75rem}
@media(max-width:768px){.sb{display:none!important}.sr{grid-template-columns:repeat(2,1fr)}.mn{padding:.75rem}.pt{font-size:15px}.tb{padding:.5rem .75rem}.tblt{display:none}}
</style>
</head>
<body>
<div id="ls">
  <div class="ltb">
    <div class="lla">
      <div class="lli">💙</div>
      <div><div class="llt">Team Zohra</div><div class="lls">Suivi Equipe</div></div>
    </div>
    <div class="lcz">
      <div class="lct" id="lck">--:--:--</div>
      <div class="lcd" id="ldt">---</div>
    </div>
  </div>
  <div class="lb">
    <div class="lc">
      <div class="lch">
        <div class="lci">👋</div>
        <div><div class="lct2">Bienvenue !</div><div class="lcd2">Selectionne ton profil et entre ton code</div></div>
      </div>
      <div class="fl">
        <label>Profil</label>
        <select id="su">
          <option value="">Choisir</option>
          <option value="admin">RM Latreche Zohra</option>
          <option value="amb">Assistant Media Buyer</option>
          <option value="sc">Superviseur Creatif</option>
          <option value="cm">Community Manager</option>
          <option value="dw">Developpeur Web</option>
          <option value="rrp">Responsable Recherche</option>
          <option value="mv1">MV1 Medjahed Asmaa</option>
          <option value="mv2">MV2 Medjdoubi Amina</option>
          <option value="mv3">MV3 Aouabdi Nadia</option>
          <option value="mv4">MV4 Sedikki Kawter</option>
        </select>
      </div>
      <div class="fl">
        <label>Code</label>
        <input type="password" id="pw" placeholder="......">
      </div>
      <button class="btnl" id="btnLogin">Acceder</button>
      <div class="lerr" id="le"></div>
    </div>
  </div>
  <div class="lft">Team Zohra - Systeme de suivi interne</div>
</div>
<div id="app">
  <div class="tb">
    <div class="tbl">
      <div class="tblo">💙</div>
      <div class="tblt">Suivi Equipe</div>
      <div class="tbbg" id="mbtn">📅 <span id="mlbl">---</span> ▾</div>
      <div id="mp">
        <div style="display:flex;gap:.4rem">
          <select id="sm"></select>
          <select id="sy"></select>
        </div>
        <button id="btnMonth">Confirmer</button>
      </div>
    </div>
    <div class="tbr">
      <div class="tbck" id="tck">--:--:--</div>
      <div class="tbsep"></div>
      <div class="uav" id="tav">?</div>
      <div class="unm" id="tnm">---</div>
      <button class="btnlo" id="btnLogout">Deconnexion</button>
    </div>
  </div>
  <div class="cb">
    <div class="cbt" id="cdt">---</div>
    <div class="cbst">Connecte</div>
  </div>
  <div class="rb daily" id="bd">
    <span>📋</span>
    <div><div style="font-size:14px">Rappel - Rapport Quotidien 14h30</div></div>
    <button id="closeBd">×</button>
  </div>
  <div class="rb weekly" id="bw">
    <span>📊</span>
    <div><div style="font-size:14px">Rappel - Rapport Hebdomadaire Mercredi 11h</div></div>
    <button id="closeBw">×</button>
  </div>
  <div id="ann-zone"></div>
  <div class="al">
    <div class="sb" id="sb" style="display:none"></div>
    <div class="mn" id="mc"></div>
  </div>
</div>

  h+='<div class="et"><table><thead><tr><th>#</th><th style="text-align:left">Membre</th><th>Crees</th><th>Livrees</th><th>Taux</th><th>Performance</th></tr></thead><tbody>';

  });
  h+="</tbody></table></div>";

  rows.forEach(function(r){
    var fc=r.p>=80?"linear-gradient(90deg,#16A34A,#4ADE80)":r.p>=50?"linear-gradient(90deg,#D97706,#FCD34D)":"linear-gradient(90deg,#DC2626,#F87171)";

    };
  }
  if(tab==="recap"){
    window.adDetail=function(uid){
      var dz=document.getElementById("dz");if(!dz)return;
      var d=gd(uid),c=totCmds(uid),l=totLiv(uid),p=c>0?Math.round(l/c*100):0;
      var h2='<div class="dc"><div style="font-size:14px;font-weight:700;margin-bottom:1rem">'+U[uid].n+'</div><div class="bg2">';
      for(var day=1;day<=daysInMonth();day++){
        var dt=new Date(CM.y,CM.m,day),isWE=dt.getDay()===0||dt.getDay()===6,v=parseInt(d["cmd_"+day]||0);
        h2+='<div class="bu'+(isWE?" we":"")+'">'+'<div class="bd2">'+String(day).padStart(2,"0")+'</div><div class="bv'+(v>0?" has":"")+'">'+v+"</div></div>";
      }
      h2+='</div><div class="sr" style="margin-top:1rem">';
      h2+='<div class="sc bl"><div class="sl">Crees</div><div class="sv bl">'+c+'</div></div>';
      h2+='<div class="sc gn"><div class="sl">Livrees</div><div class="sv gn">'+l+'</div></div>';
      h2+='<div class="sc '+(p>=80?"gn":p>=50?"am":"")+'"><div class="sl">Taux</div><div class="sv '+(p>=80?"gn":p>=50?"am":"")+'">'+p+'%</div></div></div></div>';
      dz.innerHTML=h2;dz.scrollIntoView({behavior:"smooth"});
    };
    setTimeout(function(){
      var canvas=document.getElementById("chart-r");
      if(!canvas||!window.Chart)return;
      var mks2=Object.keys(U).filter(function(k){return U[k].r!=="admin";});
      var w2=getWks(),labels=w2.map(function(x,i){return "S"+(i+1)+" ("+x[0]+"-"+x[1]+")";});
      var colors=["#3B82F6","#22C55E","#F59E0B","#8B5CF6","#EF4444","#06B6D4","#D97706","#7C3AED","#059669"];
      var datasets=mks2.map(function(uid,i){return {label:U[uid].n.split(" ")[0],data:wkSums(uid),borderColor:colors[i%colors.length],backgroundColor:colors[i%colors.length]+"22",tension:.4,fill:false,pointRadius:4};});
      new Chart(canvas,{type:"line",data:{labels:labels,datasets:datasets},options:{responsive:true,plugins:{legend:{position:"bottom",labels:{font:{size:11},boxWidth:12}}},scales:{y:{beginAtZero:true},x:{}}}});
    },200);
  }
}
</script>
